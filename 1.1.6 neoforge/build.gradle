plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'hexcassettes.miyucomics'
version = '1.1.6'

base {
    archivesName = 'Hexcassettes-neoforge'
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Mods must be declared at the extension level (MDG 2.0): this is what
    // populates -Dfml.modFolders for the run tasks. Declaring it inside runs {}
    // creates an empty model and the mod classes never reach the game.
    mods {
        hexcassettes {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.blamejared.com'
    }

    maven {
        url = 'https://maven.parchmentmc.org'
    }

    maven {
        url = 'https://jitpack.io'
    }

    // Mod jars shipped locally for dev runtime / compile-time API
    flatDir {
        dir 'libs'
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Hex Casting 0.12.0 official NeoForge 1.21.1 build (compile-time API + dev runtime mod)
    implementation files('libs/hexcasting-neoforge-1.21.1-0.12.0.jar')

    // Mods present only at dev runtime
    // NOTE: moreiotas removed - it crashes without its ejml dep and is not required by hexcassettes
    localRuntime files(
            'libs/hexcasting-neoforge-1.21.1-0.12.0.jar',
            'libs/inline-neoforge-1.21.1-1.2.2.jar',
            'libs/paucal-0.7.1-pre-27+1.21.1-neoforge.jar',
            'libs/caelus-neoforge-7.0.1+1.21.1.jar',
            'libs/cloth-config-15.0.140-neoforge.jar',
            'libs/kotlinforforge-5.12.0-all.jar',
            'libs/architectury-13.0.11-neoforge.jar',
            'libs/Patchouli-1.21.1-93-NEOFORGE.jar'
    )
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : '1.21.1',
            minecraft_version_range: '[1.21.1]',

            neo_version            : '21.1.265',
            loader_version_range   : '[1,)',

            mod_id                 : 'hexcassettes',
            mod_name               : 'Hexcassettes NeoForge',

            mod_license            : 'MIT',
            mod_version            : project.version.toString(),

            mod_authors            : 'Mrwyvern, original mod by miyucomics and ChuijkYahus',
    ]

    inputs.properties replaceProperties

    filesMatching([
            'META-INF/neoforge.mods.toml'
    ]) {
        expand replaceProperties
    }
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Hexcassettes-neoforge",
                "Specification-Vendor"    : "MiyuComics",
                "Specification-Version"   : "1",

                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "MiyuComics"
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
